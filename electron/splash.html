<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>CampaignHub</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0f172a;
        color: #e2e8f0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        -webkit-user-select: none;
      }
      .logo-badge {
        width: 76px;
        height: 76px;
        border-radius: 20px;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 30px rgba(99, 102, 241, 0.35);
        animation:
          pop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) both,
          breathe 2.2s ease-in-out 0.55s infinite;
      }
      .logo-badge img {
        width: 56px;
        height: 56px;
        display: block;
      }
      @keyframes pop {
        0% {
          opacity: 0;
          transform: scale(0.5) rotate(-8deg);
        }
        60% {
          opacity: 1;
          transform: scale(1.08) rotate(2deg);
        }
        100% {
          opacity: 1;
          transform: scale(1) rotate(0deg);
        }
      }
      @keyframes breathe {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.04);
        }
      }
      .spinner {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 3px solid rgba(226, 232, 240, 0.2);
        border-top-color: #6366f1;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      h1 {
        font-size: 15px;
        font-weight: 600;
        margin: 0;
        letter-spacing: 0.01em;
        opacity: 0;
        animation: fade-in 0.4s ease-out 0.35s both;
      }
      p {
        margin: 0;
        font-size: 12px;
        color: #94a3b8;
        opacity: 0;
        animation: fade-in 0.4s ease-out 0.5s both;
      }
      @keyframes fade-in {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="logo-badge">
      <img src="assets/logo.png" alt="CampaignHub" />
    </div>
    <h1>CampaignHub</h1>
    <div class="spinner"></div>
    <p id="status">Starting up…</p>
  </body>
</html>
